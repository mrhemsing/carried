services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: carried-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carried
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - carried-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carried"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carried-postgres-data:
